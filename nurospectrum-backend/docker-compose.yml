# Local development with Postgres:  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nurospectrum
      POSTGRES_USER: nurospectrum
      POSTGRES_PASSWORD: nurospectrum
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://nurospectrum:nurospectrum@db:5432/nurospectrum
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
